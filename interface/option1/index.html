<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vehicle Counting AI — Annotation Tool</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../shared/css/variables.css">
  <link rel="stylesheet" href="../shared/css/base.css">
  <link rel="stylesheet" href="../shared/css/components.css">
  <link rel="stylesheet" href="css/layout.css">
</head>
<body>
  <div class="app">
    <div class="content">
      <aside class="sidebar">
        <div class="sidebar__instruction">
          <div class="sidebar__instruction-header">
            <div class="sidebar__instruction-icon" id="instruction-icon"></div>
            <span class="sidebar__instruction-label">Instructions</span>
          </div>
          <p class="sidebar__instruction-text" id="instruction-text">Loading video...</p>
        </div>

        <div class="sidebar__tools">
          <div class="sidebar__section-label">Tools</div>
          <div class="sidebar__tool-group">
            <button class="tool-btn" id="btn-play-pause" title="Play / Pause (Space)">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>
              <span>Play / Pause</span>
            </button>
            <button class="tool-btn" id="btn-pen-tool" title="Pen Tool (P)">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/><path d="M2 2l7.586 7.586"/><circle cx="11" cy="11" r="2"/></svg>
              <span>Pen Tool</span>
            </button>
            <button class="tool-btn" id="btn-line-tool" title="Counting Line (L)" style="display:none">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="19" x2="19" y2="5"/><circle cx="5" cy="19" r="2"/><circle cx="19" cy="5" r="2"/></svg>
              <span>Counting Line</span>
            </button>
            <button class="tool-btn" id="btn-erase-tool" title="Erase Tool (E)" style="display:none">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m7 21-4.3-4.3c-1-1-1-2.5 0-3.4l9.6-9.6c1-1 2.5-1 3.4 0l5.6 5.6c1 1 1 2.5 0 3.4L13 21"/><path d="M22 21H7"/><path d="m5 11 9 9"/></svg>
              <span>Erase</span>
            </button>
          </div>
        </div>

        <div class="sidebar__actions">
          <button class="btn btn--secondary btn--sm" id="btn-mark-more" style="display:none">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            Mark More Roads
          </button>
          <button class="btn btn--primary btn--sm" id="btn-preview" style="display:none">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            Preview
          </button>
        </div>
      </aside>

      <main class="workspace">
        <div class="annotation-container" id="annotation-container" data-mode="idle">
          <video id="video-player" muted playsinline preload="auto"></video>
          <canvas id="annotation-canvas"></canvas>
        </div>

        <div class="canvas-panel label-panel" id="label-panel">
          <label class="label" for="label-input">Road Label</label>
          <input class="input" type="text" id="label-input" placeholder="e.g. Main Road, Lane 1..." autocomplete="off">
          <button class="btn btn--primary btn--sm" id="btn-save-label">Save</button>
        </div>

        <div class="canvas-panel action-bar" id="action-bar">
          <button class="btn btn--secondary btn--sm" id="btn-make-changes">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
            Make Changes
          </button>
          <button class="btn btn--primary btn--sm" id="btn-start-processing">
            Start Processing
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>
          </button>
        </div>
      </main>
    </div>
  </div>

  <div class="complete-screen" id="complete-screen">
    <h1 class="complete-screen__title">Annotations Saved</h1>
    <button class="btn btn--primary btn--lg" id="btn-start-processing-final">
      Start Processing
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>
    </button>
  </div>

  <div class="error-banner" id="error-banner"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
